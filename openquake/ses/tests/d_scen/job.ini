[general]

description = Test scenario analysis with spatial correlation
calculation_mode = scenario
random_seed = 113

[Rupture information]
rupture_model_file = rupture_model.csv

[Hazard sites]
region = 0.5 -1.0, 0.5 0.7, 2.2 0.7, 2.2 -1.0
region_grid_spacing = 5.0

[Site parameters]

reference_vs30_type = measured
reference_vs30_value = 600.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[Calculation parameters]
gsim_logic_tree_file = gmclt.xml
intensity_measure_types = PGA, SA(0.3), SA(0.7), SA(1.0)
within_event_correlation_model = JayaramBaker2009
within_event_correlation_params = {"vs30_clustering": False}
truncation_level = 5.0
maximum_distance = 300.0
number_of_ground_motion_fields = 3
ground_motion_fields = true
