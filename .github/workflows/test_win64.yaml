---
name: Windows Test
on:
  push:
    branches:
      - test
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      git-ref:
        description: OQ engine branch
        default: master
        required: true
jobs:
  test:
    name: Windows Installation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation of GMT from standalone
        run: |
          curl -L -O "https://github.com/GenericMappingTools/gmt/releases/download/6.6.0/gmt-6.6.0-win64.exe"
          Get-ChildItem -Filter gmt*.exe
          $Install = Get-ChildItem -Filter gmt*.exe
          Start-Process -FilePath $Install.Fullname -ArgumentList "/S" -Verb RunAs
          Start-Sleep -Seconds 180
          Get-ChildItem -Path "C:\programs\gmt6\"
          $Env:PATH += ";C:\programs\gmt6\bin"
          Write-Host ${env:PATH}
      - name: Test installation of GMT
        run: |
          Start-Sleep -Seconds 60
          Write-Host ${env:PATH}
          $Env:PATH += ";C:\programs\gmt6\bin"
          gmt.exe --version
      - name: Run scripts to install on windows
        env:
          BRANCH: ${{ github.event.inputs.git-ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host ${env:PATH}
          $Env:PATH += ";C:\programs\gmt6\bin"
          Write-Host "Set LIBRARY PATH for GMT"
          $Env:GMT_LIBRARY_PATH="C:\programs\gmt6\bin"
          Write-Host "Git branch for Run action "${Env:GIT_BRANCH}
          #
          $curDir = Get-Location
          Write-Host "Current Working Directory: $curDir"
          Write-Host $Env:GITHUB_REF
          set PIP_DEFAULT_TIMEOUT=100
          python -m pip install -U pip
          #
          # use the oq-engine branch given to a workflow_dispatch run, master otherwise
          $OQ_REF = "master"
          if ($Env:BRANCH) { $OQ_REF = $Env:BRANCH }
          Write-Host "Install OQ from $OQ_REF and mbtk from branch ${{ github.ref_name }}"
          git clone --depth 1 -b $OQ_REF https://github.com/gem/oq-engine.git
          cd oq-engine
          python install.py devel
          if ($LASTEXITCODE -ne 0) {
            break
          }
          cd ..
          C:\Users\runneradmin\openquake\Scripts\activate.ps1
          $pythonVersion = "${{ matrix.python-version }}"
          python -m pip install -r requirements-win64.txt
          python -m pip install -e .
          $Env:MPLBACKEND="AGG"
          $Env:PYTHONUTF8=1
          oq.exe engine --upgrade-db
          oq.exe --version
          Write-Host "Print all environments variables to check"
          dir env:
          Write-Host "Print all pypip packages"
          pip list
      - name: Run tests
        env:
          BRANCH: ${{ github.event.inputs.git-ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host ${env:PATH}
          $Env:PATH += ";C:\programs\gmt6\bin"
          Write-Host "Set LIBRARY PATH for GMT"
          $Env:GMT_LIBRARY_PATH="C:\programs\gmt6\bin"
          Write-Host "Git branch for Run action "${Env:GIT_BRANCH}
          #
          $curDir = Get-Location
          Write-Host "Current Working Directory: $curDir"
          Write-Host "Test python version"
          python -V
          C:\Users\runneradmin\openquake\Scripts\activate.ps1
          $curDir = Get-Location
          Write-Host "Current Working Directory: $curDir"
          cd openquake
          pytest -vs --color=yes --durations=10 cat ghm man mbt sub wkf smt hmtk
