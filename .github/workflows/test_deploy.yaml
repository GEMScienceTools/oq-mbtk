name: test and make pages

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      git-ref:
        description: OQ engine branch
        default: master
        required: true
jobs:
  test:
    name: hazard test ${{ matrix.python-version}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.13"]
    env:
      MPLBACKEND: 'Agg'
      GITHUB_PULL_REQUEST: ${{ github.event.number }}
      GITHUB_DEF_BR:  ${{ github.event.repository.default_branch }}
      GITHUB_REF:  ${{ github.ref }}
      GITHUB_HD_REF:  ${{ github.head_ref }}
      GITHUB_BS_REF:  ${{ github.base_ref }}
      GITHUB_INPUT_REF: ${{ github.event.inputs.git-ref }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get install -y gmt gmt-dcw gmt-gshhg libgmt-dev
        #python -m pip install --upgrade pip
        # use the oq-engine branch given to a workflow_dispatch run, master otherwise
        OQ_REF="${GITHUB_INPUT_REF:-master}"
        echo "Use oq-engine branch: $OQ_REF"
        git clone --depth=1 -b "$OQ_REF" https://github.com/gem/oq-engine.git
        cd oq-engine
        python install.py devel
        if [[ $EXIT_CODE -ne 0 ]]; then
             break
        fi
        source ~/openquake/bin/activate
        cd ..
        pip install -r requirements-linux.txt
        pip install -e .
        pip install pytest
    - name: Run test with pytest
      run: |
        source ~/openquake/bin/activate
        oq engine --upgrade-db
        oq --version
        sleep 3
        cd openquake
        pytest -vs --color=yes cat ghm man mbi mbt sub wkf smt fnm hmtk
  pages:
    name: pages
    runs-on: ubuntu-latest
    needs: test
    env:
      MPLBACKEND: 'Agg'
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.13"
    - name: Install OpenQuake dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt-get install pandoc
        python -m pip install --upgrade pip
        git clone --depth=1 https://github.com/gem/oq-engine.git
        cd oq-engine
        python3 install.py devel
        sleep 3
        source ~/openquake/bin/activate
        pip install sphinx
        pip install recommonmark
        pip install sphinx_rtd_theme
        pip install nbsphinx
    - name: Make html pages
      run: |
        source ~/openquake/bin/activate
        cd docsrc ; sphinx-apidoc -o contents/ ../openquake ; make html
        touch _build/html/.nojekyll

    - name: Deploy to GitHub Pages
      if: success()
      uses: crazy-max/ghaction-github-pages@v2
      with:
        target_branch: gh-pages
        build_dir: docsrc/_build/html/
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
